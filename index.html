<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>FreesApp · 香港免費贈送</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="carousell.css" />
  <link rel="stylesheet" href="i3.css?v=11" />
</head>
<body>
  <div id="app">
    <div id="welcome" class="screen on">
      <div class="hero">
        <div class="brand"><div class="logo">F</div> FreesApp</div>
        <div class="mosaic" aria-hidden="true">
          <span style="background-image:url('https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&q=80')"></span>
          <span style="background-image:url('https://images.unsplash.com/photo-1519710164239-da123dc03ef4?w=800&q=80')"></span>
          <span style="background-image:url('https://images.unsplash.com/photo-1503602642458-232111445657?w=800&q=80')"></span>
        </div>
        <h1>唔好掉。<br/>送俾附近有需要嘅人。</h1>
        <p class="lead">十八區免費贈送。物品永遠 $0。</p>
        <div class="pills">
          <div class="pill">最少 3 張相</div>
          <div class="pill">狀況要填</div>
          <div class="pill">即時傾約交收</div>
          <div class="pill">雙方確認先鎖定</div>
          <div class="pill">七日免費試用</div>
        </div>
        <div class="price-card">
          <div><b>US$1 / 星期</b><span>試用完先收費 · 目標 10,000 訂閱</span></div>
          <div style="text-align:right"><b>7 日</b><span>免費全功能</span></div>
        </div>
      </div>
      <div class="cta">
        <button class="btn btn-primary" onclick="startTrial()">開始 7 日免費</button>
        <p class="fine">試用期間可瀏覽、發布、對話。物品不可標價。</p>
      </div>
    </div>
    <div id="home" class="screen">
      <div class="loc-bar">
        <button class="loc" onclick="openSheet('filter')">十八區 ▾<small>香港 · 附近免費物品</small></button>
        <button class="ghost-ico" onclick="toast('已開收藏')"></button>
      </div>
      <div class="top" style="padding-top:8px">
        <div class="search"><span>⌕</span><input id="q" placeholder="搜尋免費物品、區、類別" oninput="feed()" /></div>
      </div>
      <div class="seg"><button class="on">附近</button><button>熱門</button><button>關注</button></div>
      <div class="filters" id="filterBar"></div>
      <div class="feed"><div class="grid" id="feed"></div></div>
      <div class="tabbar">
        <button class="tab on" data-tab="發現" onclick="show('home')">發現</button>
        <button class="tab" data-tab="動態" onclick="show('activity')">動態</button>
        <button class="sell-fab" onclick="show('post')" aria-label="送出">+</button>
        <button class="tab" data-tab="對話" onclick="show('chats')">對話</button>
        <button class="tab" data-tab="個人" onclick="show('me')">個人</button>
      </div>
    </div>
    <div id="activity" class="screen">
      <div class="top"><b>動態</b></div>
      <div class="list"><div class="row"><div class="ava">♡</div><div><b>阿琳 收藏咗你嘅層架</b><div class="sub">2 小時前</div></div></div></div>
      <div class="tabbar">
        <button class="tab" data-tab="發現" onclick="show('home')">發現</button>
        <button class="tab on" data-tab="動態" onclick="show('activity')">動態</button>
        <button class="sell-fab" onclick="show('post')">+</button>
        <button class="tab" data-tab="對話" onclick="show('chats')">對話</button>
        <button class="tab" data-tab="個人" onclick="show('me')">個人</button>
      </div>
    </div>
    <div id="detail" class="screen">
      <div class="gallery" id="gallery">
        <button class="back" style="position:absolute;left:12px;top:12px" onclick="show('home')">←</button>
      </div>
      <div class="sheet" id="detailSheet"></div>
      <div class="sticky-cta" id="detailCta"></div>
    </div>
    <div id="post" class="screen">
      <div class="top"><b>送出一件免費物品</b><button class="chip" onclick="show('home')">取消</button></div>
      <div class="form">
        <label>相片（最少 3 張）</label>
        <div class="photos" id="photoSlots"></div>
        <button class="chip" style="margin-top:8px" type="button" onclick="useDemoPhotos()">用示範三張相</button>
        <input id="filePick" type="file" accept="image/*" hidden />
        <label>標題</label><input class="field" id="pTitle" maxlength="40" placeholder="例如：實木餐椅兩張" />
        <label>描述</label><textarea class="field" id="pDesc" placeholder="幾時可交、交收點、有無捲花…"></textarea>
        <label>狀況</label><div class="opts" id="condOpts"></div>
        <label>類別</label><div class="opts" id="catOpts"></div>
        <label>交收地區</label>
        <button class="field" type="button" style="text-align:left" id="pDistrictBtn" onclick="openSheet('post')">選擇十八區</button>
        <label>交收方法</label><div class="opts" id="meetOpts"></div>
        <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="pFree" checked /> 我確認完全免費，不收錢</label>
        <p class="err" id="pErr"></p>
        <button class="btn btn-primary" style="margin-top:12px" onclick="submitPost()">發佈</button>
      </div>
    </div>
    <div id="chats" class="screen">
      <div class="top"><b>對話</b></div>
      <div class="list" id="chatList"></div>
      <div class="tabbar">
        <button class="tab" data-tab="發現" onclick="show('home')">發現</button>
        <button class="tab" data-tab="動態" onclick="show('activity')">動態</button>
        <button class="sell-fab" onclick="show('post')">+</button>
        <button class="tab on" data-tab="對話" onclick="show('chats')">對話</button>
        <button class="tab" data-tab="個人" onclick="show('me')">個人</button>
      </div>
    </div>
    <div id="chat" class="screen">
      <div class="top"><button class="back" onclick="show('chats')">←</button><div><b>對話</b><div class="sub">約交收</div></div><span></span></div>
      <div class="thread" id="thread"></div>
      <div class="composer"><input id="msg" placeholder="講交收時間同地點…" /><button class="send" onclick="sendMsg()">送</button></div>
    </div>
    <div id="me" class="screen">
      <div class="top"><b>個人</b></div>
      <div class="profile">
        <div class="banner"><div class="sub" style="color:#cfe8d8">香港區 MVP</div><div style="font-size:22px;font-weight:800;margin:4px 0">7 日免費進行中</div><div id="trialLeft"></div></div>
        <div class="stat"><div><b id="stGive">0</b><span>已送出</span></div><div><b id="stGet">0</b><span>已執走</span></div><div><b>離島</b><span>預設地區</span></div></div>
        <div class="row" style="margin:0"><div class="ava">R<span class="ava-count" id="meGiveBadge">0</span></div><div><b>Redbull</b><div class="sub">icon 數字 = 累計完成送出</div></div></div>
        <div id="myListings"></div>
      </div>
      <div class="tabbar">
        <button class="tab" data-tab="發現" onclick="show('home')">發現</button>
        <button class="tab" data-tab="動態" onclick="show('activity')">動態</button>
        <button class="sell-fab" onclick="show('post')">+</button>
        <button class="tab" data-tab="對話" onclick="show('chats')">對話</button>
        <button class="tab on" data-tab="個人" onclick="show('me')">個人</button>
      </div>
    </div>
    <div class="sheet-modal" id="modal" onclick="if(event.target.id==='modal')closeSheet()"><div class="sheet-body" id="modalBody"></div></div>
    <div class="toast" id="toast"></div>
  </div>
<script src="app.js?v=11"></script>
</body>
</html>
